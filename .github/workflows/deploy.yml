name: Deploy CampusFace PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: campusface-pwa-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated regression tests
        run: npm test

      - name: Build CampusFace PWA
        run: npm run build

      - name: Verify PWA manifest and service worker
        run: |
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          grep -q '"display":"standalone"' dist/manifest.webmanifest
          echo "PWA manifest and service worker are present."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy CampusFace PWA
        id: deployment
        uses: actions/deploy-pages@v4
