name: CampusFace encrypted database backup

on:
  # A change to this workflow automatically produces a fresh backup.
  # This removes the need to open Actions and press Run workflow.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backup.yml"
  schedule:
    # 02:15 UTC = 03:15 in Nigeria (WAT)
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusface-encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and validate database backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out backup metadata
        uses: actions/checkout@v4

      - name: Validate backup secrets
        shell: bash
        env:
          CAMPUSFACE_DB_URL: ${{ secrets.CAMPUSFACE_DB_URL }}
          CAMPUSFACE_BACKUP_PASSPHRASE: ${{ secrets.CAMPUSFACE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$CAMPUSFACE_DB_URL" ]]; then
            echo "::error::The CAMPUSFACE_DB_URL repository secret is missing."
            exit 1
          fi
          if [[ "$CAMPUSFACE_DB_URL" != postgresql://* && "$CAMPUSFACE_DB_URL" != postgres://* ]]; then
            echo "::error::CAMPUSFACE_DB_URL must be a PostgreSQL connection string."
            exit 1
          fi
          PASS_LENGTH=$(printf '%s' "$CAMPUSFACE_BACKUP_PASSPHRASE" | wc -c)
          if [[ -z "$CAMPUSFACE_BACKUP_PASSPHRASE" || "$PASS_LENGTH" -lt 24 ]]; then
            echo "::error::CAMPUSFACE_BACKUP_PASSPHRASE must contain at least 24 characters."
            exit 1
          fi
          echo "Both required secrets are present. Secret values are not printed."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: "3.1.0"

      - name: Create, structurally validate and encrypt backup
        shell: bash
        env:
          CAMPUSFACE_DB_URL: ${{ secrets.CAMPUSFACE_DB_URL }}
          CAMPUSFACE_BACKUP_PASSPHRASE: ${{ secrets.CAMPUSFACE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          BACKUP_DIR="$RUNNER_TEMP/campusface-backup"
          ARCHIVE="$RUNNER_TEMP/campusface-backup.tar.gz"
          ENCRYPTED="$RUNNER_TEMP/campusface-backup-$GITHUB_RUN_ID.tar.gz.gpg"
          PASSPHRASE_FILE="$RUNNER_TEMP/campusface-backup-passphrase"

          mkdir -p "$BACKUP_DIR"
          umask 077
          printf '%s' "$CAMPUSFACE_BACKUP_PASSPHRASE" > "$PASSPHRASE_FILE"
          chmod 600 "$PASSPHRASE_FILE"

          cleanup() {
            rm -rf "$BACKUP_DIR"
            rm -f "$ARCHIVE" "$PASSPHRASE_FILE"
          }
          trap cleanup EXIT

          supabase --version

          # Scope both SQL exports explicitly to CampusFace's public application schema.
          # Supabase CLI excludes managed schemas (including auth and storage) and extension-owned objects.
          supabase db dump --remote="$CAMPUSFACE_DB_URL" --file "$BACKUP_DIR/roles.sql" --role-only
          supabase db dump --remote="$CAMPUSFACE_DB_URL" --schema=public --file "$BACKUP_DIR/schema.sql"
          supabase db dump --remote="$CAMPUSFACE_DB_URL" --schema=public --file "$BACKUP_DIR/data.sql" --use-copy --data-only

          for file in roles.sql schema.sql data.sql; do
            if [[ ! -s "$BACKUP_DIR/$file" ]]; then
              echo "::error::Backup output is missing or empty: $file"
              exit 1
            fi
          done

          # Validate all 12 known application table definitions independent of
          # SQL identifier quoting, case, and line wrapping.
          python3 - "$BACKUP_DIR/schema.sql" "$BACKUP_DIR/data.sql" <<'PY'
          import pathlib
          import re
          import sys

          schema_path = pathlib.Path(sys.argv[1])
          data_path = pathlib.Path(sys.argv[2])
          schema_text = schema_path.read_text(encoding="utf-8")
          data_text = data_path.read_text(encoding="utf-8")
          normalized = re.sub(r"\s+", " ", schema_text.replace('"', "")).casefold()

          expected = [
              "faculties", "departments", "courses", "staff_profiles",
              "students", "student_courses", "lecturer_course_assignments",
              "attendance_sessions", "session_enrolment_snapshots",
              "attendance_records", "staff_management_audit",
              "biometric_processing_gate",
          ]

          missing = []
          for table in expected:
              pattern = (
                  r"\bcreate\s+table\s+"
                  r"(?:if\s+not\s+exists\s+)?"
                  r"public\s*\.\s*" + re.escape(table) + r"\b"
              )
              if not re.search(pattern, normalized, flags=re.IGNORECASE):
                  missing.append(table)

          if missing:
              print("Missing table definitions: " + ", ".join(missing))
              print("CREATE TABLE statement prefixes found:")
              for line in schema_text.splitlines():
                  if re.search(r"\bcreate\s+table\b", line, flags=re.IGNORECASE):
                      print(line[:180])
              sys.exit(1)

          if not data_text.strip():
              print("Data export is empty.")
              sys.exit(1)

          print("Schema validation passed: all 12 CampusFace tables are present.")
          print("Data export is present and non-empty.")
          PY

          {
            echo "CampusFace database backup"
            echo "Created UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Project ref: rgyhdivtvjkbgantrdpe"
            echo "Supabase CLI: $(supabase --version)"
            echo "Scope: custom database roles, public application schema, and public application data"
            echo "Included tables: faculties, departments, courses, staff_profiles, students, student_courses, lecturer_course_assignments, attendance_sessions, session_enrolment_snapshots, attendance_records, staff_management_audit, biometric_processing_gate"
            echo "Excluded by Supabase CLI: managed auth and storage schemas, extension-managed objects"
            echo "This archive is encrypted with GPG AES-256."
          } > "$BACKUP_DIR/backup-manifest.txt"

          tar -czf "$ARCHIVE" -C "$BACKUP_DIR" roles.sql schema.sql data.sql backup-manifest.txt

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$PASSPHRASE_FILE" \
            --symmetric --cipher-algo AES256 --compress-algo none \
            --output "$ENCRYPTED" "$ARCHIVE"

          # Verify decryption and archive readability without writing plaintext back to disk.
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$PASSPHRASE_FILE" --decrypt "$ENCRYPTED" \
            | tar -tzf - > "$RUNNER_TEMP/campusface-backup-file-list.txt"

          test -s "$ENCRYPTED"
          echo "Encrypted backup created and archive integrity verified."
          echo "Encrypted file SHA-256:"
          sha256sum "$ENCRYPTED"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusface-encrypted-db-backup-$GITHUB_RUN_ID
          path: ${{ runner.temp }}/campusface-backup-$GITHUB_RUN_ID.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14
