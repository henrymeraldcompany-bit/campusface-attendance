name: CampusFace encrypted database backup

on:
  schedule:
    # 02:15 UTC = 03:15 in Nigeria (WAT)
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campusface-encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and validate database backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out backup metadata
        uses: actions/checkout@v4

      - name: Validate backup secrets
        shell: bash
        env:
          CAMPUSFACE_DB_URL: ${{ secrets.CAMPUSFACE_DB_URL }}
          CAMPUSFACE_BACKUP_PASSPHRASE: ${{ secrets.CAMPUSFACE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "$CAMPUSFACE_DB_URL" ]]; then
            echo "::error::Add the CAMPUSFACE_DB_URL repository secret before running a backup."
            exit 1
          fi
          if [[ "$CAMPUSFACE_DB_URL" != postgresql://* && "$CAMPUSFACE_DB_URL" != postgres://* ]]; then
            echo "::error::CAMPUSFACE_DB_URL must be a PostgreSQL connection string."
            exit 1
          fi
          if [[ -z "$CAMPUSFACE_BACKUP_PASSPHRASE" || ${#CAMPUSFACE_BACKUP_PASSPHRASE} -lt 24 ]]; then
            echo "::error::CAMPUSFACE_BACKUP_PASSPHRASE must contain at least 24 characters."
            exit 1
          fi
          echo "Required secrets are present. Secret values are not printed."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ^3

      - name: Create and verify encrypted backup
        shell: bash
        env:
          CAMPUSFACE_DB_URL: ${{ secrets.CAMPUSFACE_DB_URL }}
          CAMPUSFACE_BACKUP_PASSPHRASE: ${{ secrets.CAMPUSFACE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail

          BACKUP_DIR="$RUNNER_TEMP/campusface-backup"
          ARCHIVE="$RUNNER_TEMP/campusface-backup.tar.gz"
          ENCRYPTED="$RUNNER_TEMP/campusface-backup-${GITHUB_RUN_ID}.tar.gz.gpg"
          PASSPHRASE_FILE="$RUNNER_TEMP/campusface-backup-passphrase"

          mkdir -p "$BACKUP_DIR"
          umask 077
          printf '%s' "$CAMPUSFACE_BACKUP_PASSPHRASE" > "$PASSPHRASE_FILE"
          chmod 600 "$PASSPHRASE_FILE"

          supabase --version

          # Supabase CLI filters out Supabase-managed schemas (including auth and storage).
          # These files cover custom database roles, application schema, and application data.
          supabase db dump --remote="$CAMPUSFACE_DB_URL" --file "$BACKUP_DIR/roles.sql" --role-only
          supabase db dump --remote="$CAMPUSFACE_DB_URL" --file "$BACKUP_DIR/schema.sql"
          supabase db dump --remote="$CAMPUSFACE_DB_URL" --file "$BACKUP_DIR/data.sql" --use-copy --data-only

          for file in roles.sql schema.sql data.sql; do
            if [[ ! -s "$BACKUP_DIR/$file" ]]; then
              echo "::error::Backup output is missing or empty: $file"
              exit 1
            fi
          done

          # Confirm key CampusFace tables appear in the schema and data exports.
          for table in faculties departments courses staff_profiles students student_courses \
                       lecturer_course_assignments attendance_sessions session_enrolment_snapshots \
                       attendance_records staff_management_audit biometric_processing_gate; do
            if ! grep -Eq "^CREATE TABLE (IF NOT EXISTS )?public\\.$table[[:space:]]" "$BACKUP_DIR/schema.sql"; then
              echo "::error::Expected CampusFace table is missing from schema dump: $table"
              exit 1
            fi
          done

          for table in staff_profiles courses students attendance_sessions attendance_records; do
            if ! grep -Eq "^COPY public\\.$table[[:space:]]" "$BACKUP_DIR/data.sql"; then
              echo "::error::Expected CampusFace data section is missing: $table"
              exit 1
            fi
          done

          {
            echo "CampusFace database backup"
            echo "Created UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Project ref: rgyhdivtvjkbgantrdpe"
            echo "Supabase CLI: $(supabase --version)"
            echo "Scope: roles, custom database schema, and non-managed database data"
            echo "Excluded by Supabase CLI: managed auth and storage schemas, extension-managed objects"
            echo "This archive is encrypted with GPG AES-256."
          } > "$BACKUP_DIR/backup-manifest.txt"

          tar -czf "$ARCHIVE" -C "$BACKUP_DIR" roles.sql schema.sql data.sql backup-manifest.txt

          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$PASSPHRASE_FILE" \
            --symmetric --cipher-algo AES256 --compress-algo none \
            --output "$ENCRYPTED" "$ARCHIVE"

          # Verify decryption and archive readability without writing plaintext back to disk.
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$PASSPHRASE_FILE" --decrypt "$ENCRYPTED" \
            | tar -tzf - > "$RUNNER_TEMP/campusface-backup-file-list.txt"

          test -s "$ENCRYPTED"
          echo "Encrypted backup created and archive integrity verified."
          echo "Encrypted file SHA-256:"
          sha256sum "$ENCRYPTED"

          # Remove all plaintext database exports and the passphrase file before artifact upload.
          rm -rf "$BACKUP_DIR"
          rm -f "$ARCHIVE" "$PASSPHRASE_FILE"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusface-encrypted-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/campusface-backup-${{ github.run_id }}.tar.gz.gpg
          if-no-files-found: error
          retention-days: 14
