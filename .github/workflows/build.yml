name: Project build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore verified face model assets
        uses: actions/cache@v4
        with:
          path: public/face-models
          key: campusface-face-models-v1-${{ hashFiles('package.json', 'scripts/prepare-face-assets.mjs') }}
      - name: Install dependencies
        run: npm install
      - name: Run automated regression tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build

      - name: Verify bundled face model assets
        run: |
          test -s dist/face-models/mediapipe/vision_wasm_internal.js
          test -s dist/face-models/mediapipe/vision_wasm_internal.wasm
          test -s dist/face-models/onnxruntime/ort-wasm-simd-threaded.mjs
          test -s dist/face-models/onnxruntime/ort-wasm-simd-threaded.wasm
          test -s dist/face-models/models/face_landmarker.task
          test -s dist/face-models/models/face_recognition_sface_2021dec.onnx
          echo "All verified local face model assets are included in dist."
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance tests
        run: npm run test:e2e
